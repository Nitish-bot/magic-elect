[workspace]
members = [
    "programs/*",
    "crates/permission-client",
]
resolver = "2"

[profile.release]
overflow-checks = true
lto = "fat"
codegen-units = 1
[profile.release.build-override]
opt-level = 3
incremental = false
codegen-units = 1

[workspace.dependencies]
anchor-lang = "0.31.1"
ephemeral-rollups-sdk = { version = "0.6", features = ["anchor"] }
magicblock-permission-client = { path = "crates/permission-client" }
session-keys = { version = "3.0.10", features = ["no-entrypoint"] }